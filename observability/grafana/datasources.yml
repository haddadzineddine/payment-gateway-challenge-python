apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2: # "Logs for this span" button on each span
        datasourceUid: loki
        customQuery: true
        query: '{service_name="payment-gateway"} | trace_id="$${__span.traceId}"'
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields: # trace_id on each log line links to its trace
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
